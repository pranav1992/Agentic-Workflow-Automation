# Production-grade docker-compose with enhanced configuration
version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: voiceorchid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
      POSTGRES_DB: ${POSTGRES_DB:-voiceorchid}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devuser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voiceorchid-network
    security_opt:
      - no-new-privileges:true

  livekit:
    image: livekit/livekit-server:v1.13.6
    container_name: voiceorchid-livekit
    restart: unless-stopped
    # Host networking so WebRTC media (the UDP port range in livekit.prod.yaml)
    # binds directly on the EC2 host's public interface — required for clients
    # to actually reach the SFU; Docker's per-port NAT doesn't work for this.
    network_mode: host
    command: ["--config", "/etc/livekit.yaml", "--keys", "${LIVEKIT_API_KEY:?LIVEKIT_API_KEY must be set}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET must be set}"]
    volumes:
      - ./livekit/livekit.prod.yaml:/etc/livekit.yaml:ro
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ./AgentServer
      dockerfile: Dockerfile
    container_name: voiceorchid-api
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_USER: ${POSTGRES_USER:-devuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-voiceorchid}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      # Browser-facing LiveKit address — the `caddy` service below fronts
      # the LiveKit signaling websocket with TLS (wss://<LIVEKIT_HOST>),
      # since browsers only allow mic access on a secure context. Media
      # (audio) still flows directly over UDP to the host's public IP,
      # unaffected by this — only signaling goes through Caddy.
      LIVEKIT_URL: ${LIVEKIT_URL:?LIVEKIT_URL must be set}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY must be set}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET must be set}
      # JSON array — must be the https:// origin Caddy serves the client
      # on (APP_HOST below), or the browser gets CORS errors on every
      # API call.
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
      MULTI_TENANCY_ENABLED: "true"
      RATE_LIMIT_ENABLED: "true"
      AUDIT_LOG_ENABLED: "true"
      ENABLE_METRICS: "true"
    ports:
      # Loopback-only — Caddy (network_mode: host, same loopback) is the
      # only thing that should reach this directly; the internet goes
      # through Caddy's TLS on API_HOST instead.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started
    networks:
      - voiceorchid-network
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: ./AgentServer
      dockerfile: Dockerfile
    container_name: voiceorchid-worker
    restart: unless-stopped
    command: ["python", "agents/workers/entrypoint.py", "start"]
    environment:
      PYTHONPATH: .
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_USER: ${POSTGRES_USER:-devuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-voiceorchid}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      LIVEKIT_URL: ${LIVEKIT_URL:?LIVEKIT_URL must be set}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY must be set}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET must be set}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set}
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started
    networks:
      - voiceorchid-network
    security_opt:
      - no-new-privileges:true

  client:
    build:
      context: ./AgentUi/agent@ui
      dockerfile: Dockerfile.prod
      args:
        VITE_APP_BASE_URL: ${VITE_APP_BASE_URL:-http://localhost:8000}
    container_name: voiceorchid-ui
    restart: unless-stopped
    ports:
      # Loopback-only, same reasoning as api's port above — Caddy fronts
      # this on APP_HOST with TLS.
      - "127.0.0.1:${CLIENT_INTERNAL_PORT:-8081}:80"
    depends_on:
      - api
    networks:
      - voiceorchid-network
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    container_name: voiceorchid-caddy
    restart: unless-stopped
    # Host networking so it can bind 80/443 on the EC2 host's public
    # interface and reach api/client/livekit via 127.0.0.1 (see ports
    # above and livekit's own network_mode: host).
    network_mode: host
    environment:
      APP_HOST: ${APP_HOST:?APP_HOST must be set}
      API_HOST: ${API_HOST:?API_HOST must be set}
      LIVEKIT_HOST: ${LIVEKIT_HOST:?LIVEKIT_HOST must be set}
      CLIENT_INTERNAL_PORT: ${CLIENT_INTERNAL_PORT:-8081}
      API_PORT: ${API_PORT:-8000}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - client
      - livekit
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  voiceorchid-network:
    driver: bridge
