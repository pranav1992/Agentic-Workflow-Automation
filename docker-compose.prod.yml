# Production-grade docker-compose with enhanced configuration
version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: voiceorchid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
      POSTGRES_DB: ${POSTGRES_DB:-voiceorchid}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devuser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voiceorchid-network
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    container_name: voiceorchid-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voiceorchid-network
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ./AgentServer
      dockerfile: Dockerfile
    container_name: voiceorchid-api
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_USER: ${POSTGRES_USER:-devuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-voiceorchid}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      LIVEKIT_URL: ${LIVEKIT_URL:?LIVEKIT_URL must be set}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY must be set}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET must be set}
      MULTI_TENANCY_ENABLED: "true"
      RATE_LIMIT_ENABLED: "true"
      AUDIT_LOG_ENABLED: "true"
      ENABLE_METRICS: "true"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - voiceorchid-network
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: ./AgentServer
      dockerfile: Dockerfile
    container_name: voiceorchid-worker
    restart: unless-stopped
    command: ["python", "agents/workers/entrypoint.py", "start"]
    environment:
      PYTHONPATH: .
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_USER: ${POSTGRES_USER:-devuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-voiceorchid}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      LIVEKIT_URL: ${LIVEKIT_URL:?LIVEKIT_URL must be set}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY must be set}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET must be set}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - voiceorchid-network
    security_opt:
      - no-new-privileges:true

  client:
    build:
      context: ./AgentUi/agent@ui
      dockerfile: Dockerfile.prod
      args:
        VITE_APP_BASE_URL: ${VITE_APP_BASE_URL:-http://localhost:8000}
    container_name: voiceorchid-ui
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - voiceorchid-network
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  voiceorchid-network:
    driver: bridge
