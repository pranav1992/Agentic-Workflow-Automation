services:
  api:
    build:
      context: ./AgentServer
    env_file:
      - AgentServer/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./AgentServer
    command: ["python", "agents/workers/entrypoint.py", "start"]
    environment:
      PYTHONPATH: .
    env_file:
      - AgentServer/.env.docker
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./AgentUi/agent@ui
      dockerfile: dockerfile
    env_file:
      - AgentUi/agent@ui/.env
    depends_on:
      - api
    ports:
      - "5173:5173"

  postgres:
    image: postgres:15
    container_name: postgres-dev
    restart: always
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: devdb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: redis-dev
    ports:
      - "6379:6379"

volumes:
  postgres_data:
